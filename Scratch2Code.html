<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch 原版積木造型 → C++ / C# / Python 互動教學演示平台</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --bg-panel: #1e293b;
    --bg-card: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #475569;
    --accent: #38bdf8;
    --c-motion: #4C97FF;
    --c-motion-dark: #3373CC;
    --c-looks: #9966FF;
    --c-looks-dark: #774DCB;
    --c-sound: #CF63CF;
    --c-sound-dark: #A63FA6;
    --c-events: #FFBF00;
    --c-events-dark: #CC9900;
    --c-control: #FFAB19;
    --c-control-dark: #CF8B17;
    --c-sensing: #5CB1D6;
    --c-sensing-dark: #2E8EB8;
    --c-operators: #59C059;
    --c-operators-dark: #389438;
    --c-variables: #FF8C1A;
    --c-variables-dark: #DB6E00;
    --c-lists: #FF661A;
    --c-lists-dark: #D94D00;
    --c-myblocks: #FF6680;
    --c-myblocks-dark: #E64D66;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    background: linear-gradient(135deg, #FFBF00, #FF661A);
    color: #fff;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 6px rgba(255, 102, 26, 0.4);
  }

  .brand h1 {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
  }

  .brand p {
    font-size: 12px;
    color: var(--text-muted);
  }

  .preset-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .preset-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .btn {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn:hover {
    background: #475569;
    border-color: var(--accent);
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.5);
    color: #fca5a5;
  }

  .btn-danger:hover {
    background: rgba(239, 68, 68, 0.3);
    border-color: #ef4444;
    color: #fff;
  }

  .main-container {
    display: grid;
    grid-template-columns: 390px 1fr 470px;
    flex: 1;
    overflow: hidden;
  }

  .palette-pane {
    background: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .search-box {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    background: #162032;
  }

  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-dark);
    color: #fff;
    font-size: 13px;
    outline: none;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .palette-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .category-sidebar {
    width: 80px;
    background: #131c2e;
    border-right: 1px solid var(--border-color);
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .cat-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 7px 4px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    transition: all 0.15s;
  }

  .cat-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
  }

  .cat-btn.active {
    background: rgba(56, 189, 248, 0.15);
    color: #fff;
    font-weight: 700;
  }

  .cat-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
  }

  .block-list {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .palette-group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 6px;
    margin-bottom: 2px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--border-color);
  }

  .scratch-block-outer {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    cursor: grab;
    user-select: none;
    position: relative;
    max-width: 100%;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.28));
  }

  .scratch-block-outer:active {
    cursor: grabbing;
  }

  .scratch-block-outer.selected > .sb-stack,
  .scratch-block-outer.selected > .sb-c-wrap {
    outline: 2.5px solid #38bdf8;
    outline-offset: 2px;
    border-radius: 6px;
  }

  .sb-stack {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 9px 14px 11px 14px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.22);
    border-radius: 4px;
    min-height: 38px;
  }

  .sb-stack.has-top::before {
    content: "";
    position: absolute;
    top: 0;
    left: 16px;
    width: 16px;
    height: 4px;
    background: #141d2f;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.35);
  }

  .palette-pane .sb-stack.has-top::before {
    background: var(--bg-panel);
  }

  .sb-stack.has-bottom::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 16px;
    width: 16px;
    height: 5px;
    background: inherit;
    border-bottom-left-radius: 3px;
    border-bottom-right-radius: 3px;
    z-index: 2;
  }

  .sb-stack.is-hat {
    border-top-left-radius: 20px;
    border-top-right-radius: 28px;
    padding-top: 14px;
    margin-top: 4px;
  }

  .sb-stack.is-cap {
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
    padding-bottom: 9px;
  }

  .sb-reporter {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 5px 14px;
    border-radius: 999px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
    min-height: 28px;
  }

  .sb-boolean {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 5px 18px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
    min-height: 28px;
    clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0% 50%);
  }

  .sb-c-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .sb-c-top {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 9px 14px 10px 14px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 1px rgba(0,0,0,0.22);
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
    min-width: 190px;
  }

  .sb-c-top::before {
    content: "";
    position: absolute;
    top: 0;
    left: 16px;
    width: 16px;
    height: 4px;
    background: #141d2f;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }

  .palette-pane .sb-c-top::before {
    background: var(--bg-panel);
  }

  .sb-c-top::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 32px;
    width: 16px;
    height: 5px;
    background: inherit;
    border-bottom-left-radius: 3px;
    border-bottom-right-radius: 3px;
    z-index: 2;
  }

  .sb-c-mouth-row {
    display: flex;
    align-items: stretch;
    width: 100%;
  }

  .sb-c-arm {
    width: 16px;
    flex-shrink: 0;
  }

  .sb-c-slot {
    flex: 1;
    min-width: 210px;
    min-height: 40px;
    padding: 7px 8px;
    background: rgba(15, 23, 42, 0.42);
    border: 1px dashed rgba(255, 255, 255, 0.35);
    border-left: none;
    border-radius: 0 6px 6px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .sb-c-slot.drag-over,
  .workspace-canvas.drag-over {
    background: rgba(56, 189, 248, 0.14);
    border-color: #38bdf8;
  }

  .sb-c-mid {
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: 5px 14px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    border-radius: 0 4px 4px 0;
    min-width: 120px;
  }

  .sb-c-mid::before {
    content: "";
    position: absolute;
    top: 0;
    left: 32px;
    width: 16px;
    height: 4px;
    background: #141d2f;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }

  .sb-c-mid::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 32px;
    width: 16px;
    height: 5px;
    background: inherit;
    border-bottom-left-radius: 3px;
    border-bottom-right-radius: 3px;
    z-index: 2;
  }

  .sb-c-bottom {
    position: relative;
    height: 16px;
    min-width: 140px;
    border-radius: 0 4px 4px 4px;
  }

  .sb-c-bottom::before {
    content: "";
    position: absolute;
    top: 0;
    left: 32px;
    width: 16px;
    height: 4px;
    background: #141d2f;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }

  .sb-c-bottom::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 16px;
    width: 16px;
    height: 5px;
    background: inherit;
    border-bottom-left-radius: 3px;
    border-bottom-right-radius: 3px;
    z-index: 2;
  }

  .col-motion { background-color: var(--c-motion); border: 1px solid var(--c-motion-dark); }
  .col-looks { background-color: var(--c-looks); border: 1px solid var(--c-looks-dark); }
  .col-sound { background-color: var(--c-sound); border: 1px solid var(--c-sound-dark); }
  .col-events { background-color: var(--c-events); border: 1px solid var(--c-events-dark); }
  .col-control { background-color: var(--c-control); border: 1px solid var(--c-control-dark); }
  .col-sensing { background-color: var(--c-sensing); border: 1px solid var(--c-sensing-dark); }
  .col-operators { background-color: var(--c-operators); border: 1px solid var(--c-operators-dark); }
  .col-variables { background-color: var(--c-variables); border: 1px solid var(--c-variables-dark); }
  .col-lists { background-color: var(--c-lists); border: 1px solid var(--c-lists-dark); }
  .col-myblocks { background-color: var(--c-myblocks); border: 1px solid var(--c-myblocks-dark); }

  .b-input {
    background: #fff;
    color: #1e293b;
    border: none;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 700;
    min-width: 28px;
    max-width: 110px;
    text-align: center;
    outline: none;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.22);
  }

  .b-select {
    background: rgba(0, 0, 0, 0.18);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }

  .b-select option {
    background: #1e293b;
    color: #fff;
  }

  .b-slot-bool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 48px;
    min-height: 22px;
    background: rgba(0, 0, 0, 0.24);
    clip-path: polygon(9px 0%, calc(100% - 9px) 0%, 100% 50%, calc(100% - 9px) 100%, 9px 100%, 0% 50%);
    padding: 1px 11px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
  }

  .b-slot-bool.drag-over {
    background: rgba(255, 255, 255, 0.45);
  }

  .workspace-pane {
    background-color: #141d2f;
    background-image: radial-gradient(#28354f 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .pane-header {
    background: rgba(30, 41, 59, 0.92);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .pane-subtitle {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
  }

  .workspace-canvas {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }

  .workspace-empty {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    border: 2px dashed var(--border-color);
    border-radius: 12px;
    padding: 36px 28px;
    max-width: 360px;
    pointer-events: none;
  }

  .workspace-empty h3 {
    color: var(--text-main);
    margin-bottom: 8px;
    font-size: 16px;
  }

  .ws-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .del-btn {
    background: rgba(15, 23, 42, 0.75);
    color: #f87171;
    border: 1px solid rgba(248, 113, 113, 0.4);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.75;
    transition: all 0.15s;
  }

  .del-btn:hover {
    opacity: 1;
    background: #ef4444;
    color: #fff;
  }

  .drop-placeholder {
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 8px;
    pointer-events: none;
  }

  .code-pane {
    background: var(--bg-panel);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .lang-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: #162032;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }

  .lang-btn {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-dark);
    color: var(--text-muted);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .lang-btn:hover {
    color: #fff;
    border-color: var(--accent);
  }

  .lang-btn.active {
    background: var(--accent);
    color: #0f172a;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  }

  .copy-btn {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }

  .copy-btn:hover {
    background: #475569;
  }

  .code-viewer {
    flex: 1;
    background: #0b1120;
    padding: 14px 0;
    overflow: auto;
    font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .code-line {
    display: flex;
    padding: 1px 14px;
    transition: background-color 0.12s;
    white-space: pre;
  }

  .code-line.highlight {
    background-color: rgba(56, 189, 248, 0.22);
    border-left: 3px solid #38bdf8;
    padding-left: 11px;
  }

  .line-num {
    width: 32px;
    color: #475569;
    user-select: none;
    text-align: right;
    padding-right: 12px;
    flex-shrink: 0;
  }

  .line-code {
    color: #e2e8f0;
  }

  .tok-kw { color: #c084fc; font-weight: 600; }
  .tok-type { color: #38bdf8; }
  .tok-str { color: #4ade80; }
  .tok-com { color: #64748b; font-style: italic; }

  .concept-card {
    background: #162032;
    border-top: 1px solid var(--border-color);
    padding: 14px 16px;
    max-height: 210px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .concept-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .concept-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }

  .concept-tag {
    font-size: 11px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .concept-body {
    font-size: 12.5px;
    line-height: 1.6;
    color: #cbd5e1;
  }

  .concept-tip {
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(250, 204, 21, 0.1);
    border-left: 3px solid #facc15;
    color: #fef08a;
    font-size: 12px;
    border-radius: 0 4px 4px 0;
  }
  /* ===== RWD ===== */
  html { -webkit-text-size-adjust: 100%; }
  body { height: 100vh; height: 100dvh; }
  .mobile-tabs { display: none; }
  .scratch-block-outer, .scratch-block-outer * { -webkit-touch-callout: none; }
  .touch-ghost {
    position: fixed; z-index: 9999; pointer-events: none; opacity: 0.85;
    transform: translate(-12px, -12px); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .touch-ghost .scratch-block-outer { filter: none; }
  .slot-target { outline: 2px dashed #facc15 !important; outline-offset: 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%);
    background: #0b1120; color: #fff; border: 1px solid var(--accent);
    padding: 8px 14px; border-radius: 20px; font-size: 13px; z-index: 10000;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 平板 / 小筆電 */
  @media (max-width: 1180px) {
    .main-container { grid-template-columns: 300px 1fr 360px; }
    .brand p { display: none; }
    .brand h1 { font-size: 15px; }
  }

  /* 手機與直式平板：單欄 + 底部分頁 */
  @media (max-width: 860px) {
    header { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 12px; }
    .brand { gap: 8px; }
    .brand-badge { font-size: 11px; padding: 4px 8px; }
    .brand h1 { font-size: 14px; line-height: 1.3; }
    .preset-bar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .preset-bar .btn, .preset-label { flex-shrink: 0; white-space: nowrap; }
    .btn { padding: 8px 12px; font-size: 13px; }

    .main-container { display: block; position: relative; flex: 1; min-height: 0; }
    .main-container > section { position: absolute; inset: 0; display: none; border: none; }
    .main-container > section.mobile-active { display: flex; }

    /* 積木區：分類改為上方橫向捲動列 */
    .palette-body { flex-direction: column; }
    .category-sidebar {
      width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden;
      border-right: none; border-bottom: 1px solid var(--border-color); padding: 6px;
    }
    .cat-btn { flex-direction: row; flex-shrink: 0; padding: 8px 12px; font-size: 13px; white-space: nowrap; }

let currentCategory = 'all';
let currentLang = 'cpp';
let selectedBlockUid = null;
let workspaceTree = [];
let uidCounter = 1;

function createBlockInstance(defId, overrideParams = {}, children = [], elseChildren = [], boolSlot = null) {
  const def = BLOCK_DEFS[defId];
  const params = {};
  for (const k in def.params) {
    params[k] = overrideParams[k] !== undefined ? overrideParams[k] : def.params[k].val;
  }
  return { uid: 'b_' + (uidCounter++), defId, params, children, elseChildren, boolSlot };
}

function renderCategories() {
  const sidebar = document.getElementById('categorySidebar');
  sidebar.innerHTML = CATEGORIES.map(cat => `
    <button class="cat-btn ${currentCategory === cat.id ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span>${cat.name}</span>
    </button>
  `).join('');
}

function selectCategory(catId) {
  currentCategory = catId;
  renderCategories();
  renderPalette();
}

function renderPalette() {
  const listEl = document.getElementById('blockList');
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  listEl.innerHTML = '';

  const catNameMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c.name]));
  let lastCat = '';

  Object.entries(BLOCK_DEFS).forEach(([defId, def]) => {
    if (currentCategory !== 'all' && def.cat !== currentCategory) return;
    const labelText = def.label.replace(/\{[A-Z0-9_]+\}/g, '');
    if (keyword && !labelText.toLowerCase().includes(keyword) && !catNameMap[def.cat].includes(keyword) && !defId.toLowerCase().includes(keyword)) {
      return;
    }

    if (currentCategory === 'all' && def.cat !== lastCat) {
      lastCat = def.cat;
      const title = document.createElement('div');
      title.className = 'palette-group-title';
      title.textContent = catNameMap[def.cat];
      listEl.appendChild(title);
    }

    const outer = document.createElement('div');
    outer.className = 'scratch-block-outer';
    outer.draggable = true;
    outer.appendChild(buildAuthenticShapeEl(def, null, true));

    outer.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'palette', defId }));
    });
    outer.addEventListener('click', () => addBlockToWorkspace(defId));
    outer.addEventListener('mouseenter', () => showConcept(defId));

    listEl.appendChild(outer);
  });
}

function buildAuthenticShapeEl(def, node, isPalette) {
  const colClass = 'col-' + def.cat;

  if (def.shape === 'reporter') {
    const el = document.createElement('div');
    el.className = `sb-reporter ${colClass}`;
    appendLabelParts(el, def, node, isPalette);
    return el;
  }

  if (def.shape === 'boolean') {
    const el = document.createElement('div');
    el.className = `sb-boolean ${colClass}`;
    appendLabelParts(el, def, node, isPalette);
    return el;
  }

  if (def.shape === 'c-block' || def.shape === 'c-block-else') {
    const cWrap = document.createElement('div');
    cWrap.className = 'sb-c-wrap';

    const top = document.createElement('div');
    top.className = `sb-c-top ${colClass}`;
    appendLabelParts(top, def, node, isPalette);
    cWrap.appendChild(top);

    cWrap.appendChild(buildCMouthRow(node, 'children', colClass, isPalette));

    if (def.shape === 'c-block-else') {
      const mid = document.createElement('div');
      mid.className = `sb-c-mid ${colClass}`;
      mid.textContent = def.elseLabel || '否則';
      cWrap.appendChild(mid);

      cWrap.appendChild(buildCMouthRow(node, 'elseChildren', colClass, isPalette));
    }

    const bot = document.createElement('div');
    bot.className = `sb-c-bottom ${colClass}`;
    cWrap.appendChild(bot);

    return cWrap;
  }

  const el = document.createElement('div');
  let cls = `sb-stack ${colClass}`;
  if (def.shape === 'hat') {
    cls += ' is-hat has-bottom';
  } else if (def.shape === 'cap') {
    cls += ' has-top is-cap';
  } else {
    cls += ' has-top has-bottom';
  }
  el.className = cls;
  appendLabelParts(el, def, node, isPalette);
  return el;
}

function buildCMouthRow(node, branchKey, colClass, isPalette) {
  const row = document.createElement('div');
  row.className = 'sb-c-mouth-row';

  const arm = document.createElement('div');
  arm.className = `sb-c-arm ${colClass}`;

  const slot = document.createElement('div');
  slot.className = 'sb-c-slot';

  if (!isPalette && node) {
    slot.addEventListener('dragover', e => {
      e.preventDefault();
      e.stopPropagation();
      slot.classList.add('drag-over');
    });
    slot.addEventListener('dragleave', e => {
      e.stopPropagation();
      slot.classList.remove('drag-over');
    });
    slot.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      slot.classList.remove('drag-over');
      handleDropIntoList(e, node[branchKey]);
    });
    slot.addEventListener('click', e => {
      if (!isMobileLayout()) return;
      if (e.target !== slot && !e.target.classList.contains('drop-placeholder')) return;
      e.stopPropagation();
      setPendingTarget({ kind: 'list', list: node[branchKey] }, slot);
    });

    if (node[branchKey].length === 0) {
      const ph = document.createElement('div');
      ph.className = 'drop-placeholder';
      ph.textContent = '拖曳積木至此凹槽...';
      slot.appendChild(ph);
    } else {
      node[branchKey].forEach(child => {
        slot.appendChild(renderWorkspaceNode(child));
      });
    }
  } else {
    const ph = document.createElement('div');
    ph.className = 'drop-placeholder';
    ph.textContent = '凹槽';
    slot.appendChild(ph);
  }

  row.appendChild(arm);
  row.appendChild(slot);
  return row;
}

function appendLabelParts(container, def, node, isPalette) {
  const parts = def.label.split(/(\{[A-Z0-9_]+\})/g);
  parts.forEach(part => {
    const match = part.match(/^\{([A-Z0-9_]+)\}$/);
    if (!match) {
      if (part) {
        const span = document.createElement('span');
        span.textContent = part;
        container.appendChild(span);
      }
      return;
    }

    const key = match[1];
    const pDef = def.params[key];
    if (!pDef) return;

    if (pDef.type === 'bool') {
      const bSlot = document.createElement('div');
      bSlot.className = 'b-slot-bool';
      if (!isPalette && node) {
        bSlot.addEventListener('dragover', e => {
          e.preventDefault();
          e.stopPropagation();
          bSlot.classList.add('drag-over');
        });
        bSlot.addEventListener('dragleave', e => {
          e.stopPropagation();
          bSlot.classList.remove('drag-over');
        });
        bSlot.addEventListener('click', e => {
          if (!isMobileLayout() || node.boolSlot) return;
          e.stopPropagation();
          setPendingTarget({ kind: 'bool', node }, bSlot);
        });
        bSlot.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          bSlot.classList.remove('drag-over');
          try {
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data.source === 'palette' && BLOCK_DEFS[data.defId]?.shape === 'boolean') {
              node.boolSlot = createBlockInstance(data.defId);
              renderAll();
            }
          } catch (err) {}
        });

        if (node.boolSlot) {
          bSlot.style.background = 'transparent';
          bSlot.style.padding = '0';
          const subDef = BLOCK_DEFS[node.boolSlot.defId];
          const mini = buildAuthenticShapeEl(subDef, node.boolSlot, false);
          mini.style.transform = 'scale(0.92)';
          mini.title = '雙擊移除條件積木';
          mini.addEventListener('dblclick', e => {
            e.stopPropagation();
            node.boolSlot = null;
            renderAll();
          });
          bSlot.appendChild(mini);
        } else {
          bSlot.textContent = '條件';
        }
      } else {
        bSlot.textContent = '條件';
      }
      container.appendChild(bSlot);
    } else if (pDef.type === 'select') {
      if (isPalette) {
        const span = document.createElement('span');
        span.className = 'b-select';
        const txt = pDef.options.find(o => o[0] === pDef.val)?.[1] || pDef.val;
        span.textContent = txt + ' ▾';
        container.appendChild(span);
      } else {
        const sel = document.createElement('select');
        sel.className = 'b-select';
        pDef.options.forEach(([val, text]) => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = text;
          if (node.params[key] === val) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener('click', e => e.stopPropagation());
        sel.addEventListener('change', e => {
          node.params[key] = e.target.value;
          renderCode();
        });
        container.appendChild(sel);
      }
    } else if (pDef.type === 'color') {
      const val = isPalette ? pDef.val : node.params[key];
      if (isPalette) {
        const dot = document.createElement('span');
        dot.style.cssText = `display:inline-block;width:15px;height:15px;border-radius:50%;background:${val};border:1.5px solid #fff;`;
        container.appendChild(dot);
      } else {
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.value = val;
        inp.style.cssText = 'width:22px;height:18px;border:none;border-radius:4px;cursor:pointer;';
        inp.addEventListener('click', e => e.stopPropagation());
        inp.addEventListener('input', e => {
          node.params[key] = e.target.value;
          renderCode();
        });
        container.appendChild(inp);
      }
    } else {
      const val = isPalette ? pDef.val : node.params[key];
      if (isPalette) {
        const span = document.createElement('span');
        span.className = 'b-input';
        span.textContent = val;
        container.appendChild(span);
      } else {
        const inp = document.createElement('input');
        inp.className = 'b-input';
        inp.type = 'text';
        inp.value = val;
        inp.style.width = Math.max(32, (String(val).length + 2) * 8) + 'px';
        inp.addEventListener('click', e => e.stopPropagation());
        inp.addEventListener('input', e => {
          node.params[key] = e.target.value;
          inp.style.width = Math.max(32, (e.target.value.length + 2) * 8) + 'px';
          renderCode();
        });
        container.appendChild(inp);
      }
    }
  });
}

function addBlockToWorkspace(defId) {
  const newNode = createBlockInstance(defId);
  let placed = '工作區';
  if (pendingTarget && pendingTarget.kind === 'bool') {
    if (BLOCK_DEFS[defId].shape === 'boolean') {
      pendingTarget.node.boolSlot = newNode;
      placed = '條件插槽';
    } else {
      showToast('這個插槽只能放六角形的布林積木');
      return;
    }
  } else if (pendingTarget && pendingTarget.kind === 'list') {
    pendingTarget.list.push(newNode);
    placed = 'C 型凹槽';
  } else {
    workspaceTree.push(newNode);
  }
  pendingTarget = null;
  selectedBlockUid = newNode.uid;
  showConcept(defId);
  renderAll();
  if (isMobileLayout()) {
    showToast('已加入' + placed + '，可切換到「工作區」查看');
  }
}

function renderWorkspace() {
  const canvas = document.getElementById('workspaceCanvas');
  document.getElementById('blockCountLabel').textContent = `${countBlocks(workspaceTree)} 個積木`;

  if (workspaceTree.length === 0) {
    canvas.innerHTML = `
      <div class="workspace-empty">
        <h3>拖曳或點擊原版造型積木開始</h3>
        <p>支援積木堆疊、C 型控制積木凹槽包覆，以及六角形布林條件嵌入。</p>
      </div>
    `;
    return;
  }

  canvas.innerHTML = '';
  workspaceTree.forEach(node => canvas.appendChild(renderWorkspaceNode(node)));
}

function countBlocks(list) {
  let c = 0;
  for (const item of list) {
    c += 1;
    if (item.children) c += countBlocks(item.children);
    if (item.elseChildren) c += countBlocks(item.elseChildren);
    if (item.boolSlot) c += 1;
  }
  return c;
}

function renderWorkspaceNode(node) {
  const def = BLOCK_DEFS[node.defId];
  const outer = document.createElement('div');
  outer.className = `scratch-block-outer ${selectedBlockUid === node.uid ? 'selected' : ''}`;
  outer.draggable = true;

  outer.addEventListener('dragstart', e => {
    e.stopPropagation();
    e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'workspace', uid: node.uid }));
  });
  outer.addEventListener('click', e => {
    e.stopPropagation();
    selectedBlockUid = node.uid;
    showConcept(node.defId);
    renderWorkspace();
    highlightCodeForUid(node.uid);
  });
  outer.addEventListener('mouseenter', e => {
    e.stopPropagation();
    highlightCodeForUid(node.uid);
  });

  const row = document.createElement('div');
  row.className = 'ws-row';
  row.appendChild(buildAuthenticShapeEl(def, node, false));

  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.textContent = '✕';
  delBtn.title = '刪除此積木';
  delBtn.addEventListener('click', e => {
    e.stopPropagation();
    removeNodeByUid(workspaceTree, node.uid);
    if (selectedBlockUid === node.uid) selectedBlockUid = null;
    renderAll();
  });
  row.appendChild(delBtn);

  outer.appendChild(row);
  return outer;
}

function removeNodeByUid(list, uid) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].uid === uid) return list.splice(i, 1)[0];
    if (list[i].children) {
      const f = removeNodeByUid(list[i].children, uid);
      if (f) return f;
    }
    if (list[i].elseChildren) {
      const f = removeNodeByUid(list[i].elseChildren, uid);
      if (f) return f;
    }
  }
  return null;
}

function handleCanvasDragOver(e) {
  e.preventDefault();
  document.getElementById('workspaceCanvas').classList.add('drag-over');
}

function handleCanvasDragLeave() {
  document.getElementById('workspaceCanvas').classList.remove('drag-over');
}

function handleCanvasDrop(e) {
  e.preventDefault();
  document.getElementById('workspaceCanvas').classList.remove('drag-over');
  handleDropIntoList(e, workspaceTree);
}

function handleDropIntoList(e, targetList) {
  try {
    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (data.source === 'palette') {
      const newNode = createBlockInstance(data.defId);
      targetList.push(newNode);
      selectedBlockUid = newNode.uid;
      showConcept(data.defId);
      renderAll();
    } else if (data.source === 'workspace') {
      const moved = removeNodeByUid(workspaceTree, data.uid);
      if (moved) {
        targetList.push(moved);
        renderAll();
      }
    }
  } catch (err) {}
}

function setLanguage(lang) {
  currentLang = lang;
  ['cpp', 'cs', 'py'].forEach(l => {
    document.getElementById('btn-' + l).classList.toggle('active', l === lang);
  });
  renderCode();
}

function generateLines() {
  const lines = [];
  const lang = currentLang;

  function emitList(nodes, indentLevel, targetLines) {
    const pad = '    '.repeat(indentLevel);
    nodes.forEach(node => {
      const def = BLOCK_DEFS[node.defId];
      let condCode = null;
      if (node.boolSlot) {
        condCode = BLOCK_DEFS[node.boolSlot.defId].code[lang](node.boolSlot.params);
      }

      if (def.shape === 'c-block') {
        const [head, tail] = def.code[lang](node.params, condCode);
        targetLines.push({ text: pad + head, uid: node.uid });
        if (node.children.length === 0) {
          targetLines.push({ text: pad + '    ' + (lang === 'py' ? 'pass' : '// 空區塊'), uid: node.uid });
        } else {
          emitList(node.children, indentLevel + 1, targetLines);
        }
        if (tail) targetLines.push({ text: pad + tail, uid: node.uid });
      } else if (def.shape === 'c-block-else') {
        const [head, mid, tail] = def.code[lang](node.params, condCode);
        targetLines.push({ text: pad + head, uid: node.uid });
        if (node.children.length === 0) {
          targetLines.push({ text: pad + '    ' + (lang === 'py' ? 'pass' : '// 條件成立區塊'), uid: node.uid });
        } else {
          emitList(node.children, indentLevel + 1, targetLines);
        }
        targetLines.push({ text: pad + mid, uid: node.uid });
        if (node.elseChildren.length === 0) {
          targetLines.push({ text: pad + '    ' + (lang === 'py' ? 'pass' : '// 否則區塊'), uid: node.uid });
        } else {
          emitList(node.elseChildren, indentLevel + 1, targetLines);
        }
        if (tail) targetLines.push({ text: pad + tail, uid: node.uid });
      } else if (def.shape === 'reporter' || def.shape === 'boolean') {
        const expr = def.code[lang](node.params);
        const stmt = lang === 'cpp'
          ? `cout << (${expr}) << endl;`
          : lang === 'cs'
          ? `Console.WriteLine(${expr});`
          : `print(${expr})`;
        targetLines.push({ text: pad + stmt, uid: node.uid });
      } else {
        targetLines.push({ text: pad + def.code[lang](node.params), uid: node.uid });
      }
    });
  }

  const mainNodes = [];
  const extraHats = [];
  let flagNodeUid = null;
  let currentTarget = mainNodes;

  workspaceTree.forEach(node => {
    const def = BLOCK_DEFS[node.defId];
    if (def.shape === 'hat') {
      if (node.defId === 'event_whenflagclicked') {
        flagNodeUid = node.uid;
        currentTarget = mainNodes;
      } else {
        const hatGroup = { hat: node, body: [] };
        extraHats.push(hatGroup);
        currentTarget = hatGroup.body;
      }
    } else {
      currentTarget.push(node);
    }
  });

  if (lang === 'cpp') {
    lines.push({ text: '#include <iostream>', uid: null });
       lines.push({ text: 'using namespace std;', uid: null });
    lines.push({ text: '', uid: null });

    extraHats.forEach(group => {
      const hatDef = BLOCK_DEFS[group.hat.defId];
      lines.push({ text: hatDef.code.cpp(group.hat.params), uid: group.hat.uid });
      emitList(group.body, 1, lines);
      lines.push({ text: '}', uid: group.hat.uid });
      lines.push({ text: '', uid: null });
    });

    lines.push({ text: 'int main() {', uid: flagNodeUid });
    if (mainNodes.length === 0) {
      lines.push({ text: '  ', uid: null });
    } else {
      emitList(mainNodes, 1, lines);
    }
    lines.push({ text: '    return 0;', uid: null });
    lines.push({ text: '}', uid: flagNodeUid });
  } else if (lang === 'cs') {
    lines.push({ text: 'using System;', uid: null });
    lines.push({ text: '', uid: null });
    lines.push({ text: 'public class HelloWorld {', uid: null });

    extraHats.forEach(group => {
      const hatDef = BLOCK_DEFS[group.hat.defId];
      lines.push({ text: '    static ' + hatDef.code.cs(group.hat.params), uid: group.hat.uid });
      emitList(group.body, 2, lines);
      lines.push({ text: '    }', uid: group.hat.uid });
      lines.push({ text: '', uid: null });
    });

    lines.push({ text: '    public static void Main(string[] args) {', uid: flagNodeUid });
    if (mainNodes.length === 0) {
      lines.push({ text: '        ', uid: null });
    } else {
      emitList(mainNodes, 2, lines);
    }
    lines.push({ text: '    }', uid: flagNodeUid });
    lines.push({ text: '}', uid: null });
  } else {
    extraHats.forEach(group => {
      const hatDef = BLOCK_DEFS[group.hat.defId];
      lines.push({ text: hatDef.code.py(group.hat.params), uid: group.hat.uid });
      if (group.body.length === 0) {
        lines.push({ text: '    pass', uid: group.hat.uid });
      } else {
        emitList(group.body, 1, lines);
      }
      lines.push({ text: '', uid: null });
    });

    if (mainNodes.length === 0 && extraHats.length === 0) {
      lines.push({ text: '', uid: null });
    } else {
      emitList(mainNodes, 0, lines);
    }
  }

  return lines;
}

function syntaxHighlight(code) {
  const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 單次掃描：每段文字只會被分類一次，避免後面的規則去比對前面產生的 <span> 標籤
  const tokenRe = new RegExp(
    '(\\/\\/.*$|#.*$)' +                                   // 1: 註解
    '|(".*?")' +                                           // 2: 字串
    '|\\b(if|else|while|for|return|void|int|float|double|bool|string|true|false|True|False|def|in|and|or|not|pass|await|async|new|using|public|class|static)\\b' + // 3: 關鍵字
    '|\\b(cout|endl|Math|Console|Thread|DateTime|Environment)\\b', // 4: 型別／物件
    'g'
  );
  let result = '';
  let last = 0;
  let m;
  while ((m = tokenRe.exec(code)) !== null) {
    result += escapeHtml(code.slice(last, m.index));
    const cls = m[1] !== undefined ? 'tok-com'
              : m[2] !== undefined ? 'tok-str'
              : m[3] !== undefined ? 'tok-kw'
              : 'tok-type';
    result += '<span class="' + cls + '">' + escapeHtml(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  result += escapeHtml(code.slice(last));
  return result;
}

function renderCode() {
  const viewer = document.getElementById('codeViewer');
  const lines = generateLines();
  viewer.innerHTML = lines.map((line, idx) => `
    <div class="code-line ${selectedBlockUid && line.uid === selectedBlockUid ? 'highlight' : ''}" data-uid="${line.uid || ''}">
      <span class="line-num">${idx + 1}</span>
      <span class="line-code">${syntaxHighlight(line.text)}</span>
    </div>
  `).join('');
}

function highlightCodeForUid(uid) {
  document.querySelectorAll('.code-line').forEach(el => {
    el.classList.toggle('highlight', uid && el.dataset.uid === uid);
  });
}

function copyCode() {
  const lines = generateLines().map(l => l.text).join('\n');
  navigator.clipboard.writeText(lines);
  const btn = document.getElementById('copyBtn');
  btn.textContent = '已複製！';
  setTimeout(() => { btn.textContent = '複製'; }, 1500);
}

function showConcept(defId) {
  const def = BLOCK_DEFS[defId];
  if (!def) return;
  const catName = CATEGORIES.find(c => c.id === def.cat)?.name || '';
  document.getElementById('conceptTitle').textContent = '💡 ' + def.label.replace(/\{[A-Z0-9_]+\}/g, '[參數]');
  document.getElementById('conceptCategory').textContent = catName + '積木';
  document.getElementById('conceptBody').textContent = def.concept;
  document.getElementById('conceptTip').textContent = '教學重點：' + def.tip;
}

function loadPreset(name) {
  workspaceTree = [];
  if (name === 'ifElse') {
    const cond = createBlockInstance('operator_gt', { OPERAND1: 'score', OPERAND2: '60' });
    const ifNode = createBlockInstance('control_if_else', {}, [
      createBlockInstance('looks_say', { MESSAGE: '恭喜及格！' })
    ], [
      createBlockInstance('looks_say', { MESSAGE: '再接再厲！' })
    ], cond);
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      createBlockInstance('data_setvariableto', { VAR: 'score', VALUE: '75' }),
      ifNode
    ];
  } else if (name === 'loopSum') {
    const loopNode = createBlockInstance('control_repeat', { TIMES: '10' }, [
      createBlockInstance('data_changevariableby', { VAR: 'total', VALUE: '1' }),
      createBlockInstance('motion_movesteps', { STEPS: '10' })
    ]);
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      createBlockInstance('data_setvariableto', { VAR: 'total', VALUE: '0' }),
      loopNode,
      createBlockInstance('data_showvariable', { VAR: 'total' })
    ];
  } else if (name === 'listDemo') {
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      createBlockInstance('data_deletealloflist', { LIST: 'items' }),
      createBlockInstance('data_addtolist', { ITEM: '寶劍', LIST: 'items' }),
      createBlockInstance('data_addtolist', { ITEM: '藥水', LIST: 'items' }),
      createBlockInstance('data_replaceitemoflist', { LIST: 'items', INDEX: '1', ITEM: '傳說神劍' }),
      createBlockInstance('data_showlist', { LIST: 'items' })
    ];
  } else if (name === 'cloneDemo') {
    const loop = createBlockInstance('control_repeat', { TIMES: '5' }, [
      createBlockInstance('control_create_clone_of', { CLONE_OPTION: '_myself_' }),
      createBlockInstance('control_wait', { DURATION: '0.5' })
    ]);
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      loop,
      createBlockInstance('control_start_as_clone'),
      createBlockInstance('motion_goto', { TO: '_random_' }),
      createBlockInstance('looks_show')
    ];
  }
  selectedBlockUid = workspaceTree[0]?.uid || null;
  if (workspaceTree[0]) showConcept(workspaceTree[0].defId);
  renderAll();
}

function clearWorkspace() {
  workspaceTree = [];
  selectedBlockUid = null;
  renderAll();
}

function renderAll() {
  setTimeout(() => { const b = document.getElementById('tabBadge'); const l = document.getElementById('blockCountLabel'); if (b && l) b.textContent = parseInt(l.textContent) || 0; }, 0);
  renderWorkspace();
  renderCode();
}


// ===== RWD / 觸控支援 =====
let pendingTarget = null;
function isMobileLayout() { return window.matchMedia('(max-width: 860px)').matches; }

function showPane(name) {
  ['palette', 'workspace', 'code'].forEach(n => {
    document.getElementById('pane-' + n).classList.toggle('mobile-active', n === name);
  });
  document.querySelectorAll('#mobileTabs button').forEach(b => b.classList.toggle('active', b.dataset.pane === name));
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function setPendingTarget(target, el) {
  document.querySelectorAll('.slot-target').forEach(x => x.classList.remove('slot-target'));
  pendingTarget = target;
  el.classList.add('slot-target');
  showPane('palette');
  showToast(target.kind === 'bool' ? '請選擇一個布林積木放入條件插槽' : '請選擇要放入凹槽的積木');
}

// 點選工作區空白處：取消指定的插槽
document.addEventListener('click', e => {
  if (pendingTarget && !e.target.closest('.sb-c-slot, .b-slot-bool, .scratch-block-outer, .mobile-tabs, .search-box, .category-sidebar')) {
    pendingTarget = null;
    document.querySelectorAll('.slot-target').forEach(x => x.classList.remove('slot-target'));
  }
});

function syncPaneToViewport() {
  if (isMobileLayout()) {
    if (!document.querySelector('.main-container > section.mobile-active')) showPane('palette');
  } else {
    document.querySelectorAll('.main-container > section').forEach(x => x.classList.remove('mobile-active'));
  }
}
window.addEventListener('resize', syncPaneToViewport);
syncPaneToViewport();

// 觸控拖曳：讓工作區內的積木可用手指拖進 C 型凹槽 / 條件插槽
// （HTML5 Drag & Drop 在多數手機瀏覽器不會被觸發，這裡以 touch 事件模擬）
(function initTouchDrag() {
  let drag = null;
  const HOLD_MS = 220, MOVE_PX = 8;

  function makeDT() {
    const store = {};
    return { setData: (k, v) => { store[k] = v; }, getData: k => store[k] || '', effectAllowed: 'move', dropEffect: 'move' };
  }
  function fire(el, type, dt) {
    if (!el) return;
    const ev = new Event(type, { bubbles: true, cancelable: true });
    ev.dataTransfer = dt;
    el.dispatchEvent(ev);
  }
  function cleanup() {
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.ghost) drag.ghost.remove();
    if (drag.over) fire(drag.over, 'dragleave', drag.dt);
    document.body.style.overflow = '';
    drag = null;
  }

  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    if (e.target.closest('input, select, button, textarea')) return;
    const block = e.target.closest('.scratch-block-outer[draggable="true"]');
    if (!block) return;
    // 只對工作區內的積木啟用（積木庫保持點擊加入，才能正常捲動清單）
    if (!block.closest('#workspaceCanvas')) return;
    const t = e.touches[0];
    drag = { block, startX: t.clientX, startY: t.clientY, active: false, over: null, ghost: null, dt: makeDT() };
    drag.timer = setTimeout(() => {
      if (!drag) return;
      drag.active = true;
      if (navigator.vibrate) navigator.vibrate(15);
      fire(block, 'dragstart', drag.dt);
      const g = document.createElement('div');
      g.className = 'touch-ghost';
      g.appendChild(block.cloneNode(true));
      document.body.appendChild(g);
      drag.ghost = g;
      g.style.left = drag.startX + 'px';
      g.style.top = drag.startY + 'px';
    }, HOLD_MS);
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!drag) return;
    const t = e.touches[0];
    if (!drag.active) {
      // 還沒長按就移動 → 視為捲動，取消拖曳
      if (Math.abs(t.clientX - drag.startX) > MOVE_PX || Math.abs(t.clientY - drag.startY) > MOVE_PX) cleanup();
      return;
    }
    e.preventDefault();
    drag.ghost.style.left = t.clientX + 'px';
    drag.ghost.style.top = t.clientY + 'px';
    drag.ghost.style.display = 'none';
    const under = document.elementFromPoint(t.clientX, t.clientY);
    drag.ghost.style.display = '';
    if (under !== drag.over) {
      if (drag.over) fire(drag.over, 'dragleave', drag.dt);
      drag.over = under;
    }
    fire(under, 'dragover', drag.dt);
    // 接近畫面上下緣時自動捲動工作區
    const canvas = document.getElementById('workspaceCanvas');
    const r = canvas.getBoundingClientRect();
    if (t.clientY < r.top + 40) canvas.scrollTop -= 8;
    else if (t.clientY > r.bottom - 40) canvas.scrollTop += 8;
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (!drag) return;
    if (drag.active) {
      const t = e.changedTouches[0];
      drag.ghost.style.display = 'none';
      const under = document.elementFromPoint(t.clientX, t.clientY);
      fire(under, 'drop', drag.dt);
      e.preventDefault();
    }
    cleanup();
  }, { passive: false });
  document.addEventListener('touchcancel', cleanup, { passive: true });
})();

renderCategories();
renderPalette();
clearWorkspace();
