<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch 積木轉 C++ / C# / Python 互動教學演示平台</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --bg-panel: #1e293b;
    --bg-card: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #475569;
    --accent: #38bdf8;
    /* Scratch 3.0 Official Colors */
    --c-motion: #4C97FF;
    --c-motion-dark: #3373CC;
    --c-looks: #9966FF;
    --c-looks-dark: #774DCB;
    --c-sound: #CF63CF;
    --c-sound-dark: #A63FA6;
    --c-events: #FFBF00;
    --c-events-dark: #CC9900;
    --c-control: #FFAB19;
    --c-control-dark: #CF8B17;
    --c-sensing: #5CB1D6;
    --c-sensing-dark: #2E8EB8;
    --c-operators: #59C059;
    --c-operators-dark: #389438;
    --c-variables: #FF8C1A;
    --c-variables-dark: #DB6E00;
    --c-lists: #FF661A;
    --c-lists-dark: #D94D00;
    --c-myblocks: #FF6680;
    --c-myblocks-dark: #E64D66;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    background: linear-gradient(135deg, #FFAB19, #FF661A);
    color: #fff;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 6px rgba(255, 102, 26, 0.4);
  }

  .brand h1 {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }

  .brand p {
    font-size: 12px;
    color: var(--text-muted);
  }

  .preset-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .preset-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .btn {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: #475569;
    border-color: var(--accent);
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.5);
    color: #fca5a5;
  }

  .btn-danger:hover {
    background: rgba(239, 68, 68, 0.3);
    border-color: #ef4444;
    color: #fff;
  }

  /* Main 3-Column Workspace */
  .main-container {
    display: grid;
    grid-template-columns: 380px 1fr 480px;
    flex: 1;
    overflow: hidden;
  }

  /* Column 1: Block Palette */
  .palette-pane {
    background: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .search-box {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    background: #162032;
  }

  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-dark);
    color: #fff;
    font-size: 13px;
    outline: none;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .palette-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .category-sidebar {
    width: 82px;
    background: #131c2e;
    border-right: 1px solid var(--border-color);
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .cat-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 7px 4px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    transition: all 0.15s;
  }

  .cat-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
  }

  .cat-btn.active {
    background: rgba(56, 189, 248, 0.15);
    color: #fff;
    font-weight: 700;
  }

  .cat-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
  }

  .block-list {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .palette-group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 6px;
    margin-bottom: 2px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--border-color);
  }

  /* Scratch Block Visual Styles */
  .s-block {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 7px 12px;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: grab;
    user-select: none;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    position: relative;
    transition: transform 0.1s, box-shadow 0.1s;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    max-width: 100%;
  }

  .s-block:hover {
    filter: brightness(1.06);
  }

  .s-block:active {
    cursor: grabbing;
    transform: scale(0.99);
  }

  .s-block.hat {
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding-top: 10px;
  }

  .s-block.reporter {
    border-radius: 20px;
    padding: 5px 12px;
  }

  .s-block.boolean {
    border-radius: 4px;
    clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
    padding: 5px 16px;
  }

  .s-block.cap {
    border-bottom-left-radius: 2px;
    border-bottom-right-radius: 2px;
  }

  /* Category colors */
  .cat-motion { background-color: var(--c-motion); border: 1px solid var(--c-motion-dark); }
  .cat-looks { background-color: var(--c-looks); border: 1px solid var(--c-looks-dark); }
  .cat-sound { background-color: var(--c-sound); border: 1px solid var(--c-sound-dark); }
  .cat-events { background-color: var(--c-events); border: 1px solid var(--c-events-dark); }
  .cat-control { background-color: var(--c-control); border: 1px solid var(--c-control-dark); }
  .cat-sensing { background-color: var(--c-sensing); border: 1px solid var(--c-sensing-dark); }
  .cat-operators { background-color: var(--c-operators); border: 1px solid var(--c-operators-dark); }
  .cat-variables { background-color: var(--c-variables); border: 1px solid var(--c-variables-dark); }
  .cat-lists { background-color: var(--c-lists); border: 1px solid var(--c-lists-dark); }
  .cat-myblocks { background-color: var(--c-myblocks); border: 1px solid var(--c-myblocks-dark); }

  /* Inputs inside blocks */
  .b-input {
    background: #fff;
    color: #1e293b;
    border: none;
    border-radius: 12px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 700;
    min-width: 28px;
    max-width: 110px;
    text-align: center;
    outline: none;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
  }

  .b-select {
    background: rgba(0, 0, 0, 0.18);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 10px;
    padding: 2px 6px;
    font-size: 12px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }

  .b-select option {
    background: #1e293b;
    color: #fff;
  }

  .b-slot-bool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    min-height: 22px;
    background: rgba(0, 0, 0, 0.22);
    clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0% 50%);
    padding: 1px 10px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.8);
    border: 1px dashed rgba(255, 255, 255, 0.4);
  }

  .b-slot-bool.drag-over {
    background: rgba(255, 255, 255, 0.4);
  }

  /* Column 2: Script Workspace */
  .workspace-pane {
    background-color: #141d2f;
    background-image: radial-gradient(#28354f 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .pane-header {
    background: rgba(30, 41, 59, 0.92);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .pane-subtitle {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
  }

  .workspace-canvas {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .workspace-empty {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    border: 2px dashed var(--border-color);
    border-radius: 12px;
    padding: 36px 28px;
    max-width: 360px;
    pointer-events: none;
  }

  .workspace-empty h3 {
    color: var(--text-main);
    margin-bottom: 8px;
    font-size: 16px;
  }

  /* Workspace Block Wrapper & C-Blocks */
  .ws-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    position: relative;
    width: fit-content;
    max-width: 100%;
    transition: transform 0.1s;
  }

  .ws-item.selected > .s-block,
  .ws-item.selected > .c-block-wrapper {
    outline: 2.5px solid #38bdf8;
    outline-offset: 2px;
  }

  .ws-block-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .del-btn {
    background: rgba(15, 23, 42, 0.75);
    color: #f87171;
    border: 1px solid rgba(248, 113, 113, 0.4);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.75;
    transition: all 0.15s;
  }

  .del-btn:hover {
    opacity: 1;
    background: #ef4444;
    color: #fff;
  }

  /* C-Block (Control Structures with Mouth) */
  .c-block-wrapper {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-radius: 6px;
  }

  .c-block-top {
    border-bottom-left-radius: 0;
  }

  .c-block-body {
    display: flex;
    align-items: stretch;
    width: 100%;
  }

  .c-block-spine {
    width: 16px;
    background-color: var(--c-control);
    border-left: 1px solid var(--c-control-dark);
    border-right: 1px solid var(--c-control-dark);
    flex-shrink: 0;
  }

  .c-block-inner {
    min-height: 38px;
    min-width: 210px;
    padding: 6px 8px;
    background: rgba(15, 23, 42, 0.45);
    border: 1px dashed rgba(255, 171, 25, 0.45);
    border-left: none;
    border-radius: 0 6px 6px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .c-block-inner.drag-over,
  .workspace-canvas.drag-over {
    background: rgba(56, 189, 248, 0.12);
    border-color: #38bdf8;
  }

  .c-block-mid {
    background-color: var(--c-control);
    border: 1px solid var(--c-control-dark);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 14px;
    min-width: 120px;
  }

  .c-block-bottom {
    background-color: var(--c-control);
    border: 1px solid var(--c-control-dark);
    height: 14px;
    min-width: 140px;
    border-radius: 0 6px 6px 6px;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
  }

  .drop-placeholder {
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 8px;
    pointer-events: none;
  }

  /* Column 3: Code Output & Explanation */
  .code-pane {
    background: var(--bg-panel);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .lang-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: #162032;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }

  .lang-btn {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-dark);
    color: var(--text-muted);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .lang-btn:hover {
    color: #fff;
    border-color: var(--accent);
  }

  .lang-btn.active {
    background: var(--accent);
    color: #0f172a;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  }

  .copy-btn {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }

  .copy-btn:hover {
    background: #475569;
  }

  .code-viewer {
    flex: 1;
    background: #0b1120;
    padding: 14px 0;
    overflow: auto;
    font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .code-line {
    display: flex;
    padding: 1px 14px;
    transition: background-color 0.12s;
    white-space: pre;
  }

  .code-line.highlight {
    background-color: rgba(56, 189, 248, 0.22);
    border-left: 3px solid #38bdf8;
    padding-left: 11px;
  }

  .line-num {
    width: 32px;
    color: #475569;
    user-select: none;
    text-align: right;
    padding-right: 12px;
    flex-shrink: 0;
  }

  .line-code {
    color: #e2e8f0;
  }

  /* Syntax Highlighting */
  .tok-kw { color: #c084fc; font-weight: 600; }
  .tok-type { color: #38bdf8; }
  .tok-str { color: #4ade80; }
  .tok-num { color: #fb923c; }
  .tok-com { color: #64748b; font-style: italic; }
  .tok-fn { color: #facc15; }

  /* Concept Explanation Card */
  .concept-card {
    background: #162032;
    border-top: 1px solid var(--border-color);
    padding: 14px 16px;
    max-height: 220px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .concept-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .concept-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .concept-tag {
    font-size: 11px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .concept-body {
    font-size: 12.5px;
    line-height: 1.6;
    color: #cbd5e1;
  }

  .concept-tip {
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(250, 204, 21, 0.1);
    border-left: 3px solid #facc15;
    color: #fef08a;
    font-size: 12px;
    border-radius: 0 4px 4px 0;
  }

  @media (max-width: 1150px) {
    .main-container {
      grid-template-columns: 320px 1fr 380px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">SCRATCH → CODE</div>
    <div>
      <h1>Scratch 全積木轉 C++ / C# / Python 互動教學演示平台</h1>
      <p>拖曳或點擊左側積木堆積程式，右側即時轉換三種語言並同步解析語法觀念</p>
    </div>
  </div>
  <div class="preset-bar">
    <span class="preset-label">課堂範例：</span>
    <button class="btn" onclick="loadPreset('ifElse')">分支判斷</button>
    <button class="btn" onclick="loadPreset('loopSum')">迴圈累加</button>
    <button class="btn" onclick="loadPreset('listDemo')">清單操作</button>
    <button class="btn" onclick="loadPreset('cloneDemo')">分身機制</button>
    <button class="btn btn-danger" onclick="clearWorkspace()">清空工作區</button>
  </div>
</header>

<div class="main-container">
  <!-- Left: Palette -->
  <section class="palette-pane">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜尋積木（例如：分身、隨機、清單、while、移動）..." oninput="renderPalette()">
    </div>
    <div class="palette-body">
      <div class="category-sidebar" id="categorySidebar"></div>
      <div class="block-list" id="blockList"></div>
    </div>
  </section>

  <!-- Center: Workspace -->
  <section class="workspace-pane">
    <div class="pane-header">
      <span>積木程式堆積區 <span class="pane-subtitle">（可拖曳至主畫布或控制積木凹槽內，點擊積木可檢視解說）</span></span>
      <span class="pane-subtitle" id="blockCountLabel">0 個積木</span>
    </div>
    <div class="workspace-canvas" id="workspaceCanvas"
         ondragover="handleCanvasDragOver(event)"
         ondragleave="handleCanvasDragLeave(event)"
         ondrop="handleCanvasDrop(event)">
    </div>
  </section>

  <!-- Right: Code & Concept -->
  <section class="code-pane">
    <div class="lang-tabs">
      <button class="lang-btn active" id="btn-cpp" onclick="setLanguage('cpp')">C++</button>
      <button class="lang-btn" id="btn-cs" onclick="setLanguage('cs')">C#</button>
      <button class="lang-btn" id="btn-py" onclick="setLanguage('py')">Python</button>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">複製程式碼</button>
    </div>
    <div class="code-viewer" id="codeViewer"></div>
    <div class="concept-card" id="conceptCard">
      <div class="concept-header">
        <div class="concept-title" id="conceptTitle">💡 點選或滑過積木查看觀念解析</div>
        <span class="concept-tag" id="conceptCategory">教學提示</span>
      </div>
      <div class="concept-body" id="conceptBody">
        在左側點選或拖曳任何 Scratch 積木到中間工作區，即可觀察它在 C++、C# 與 Python 中的對應寫法。
      </div>
      <div class="concept-tip" id="conceptTip">
        提示：控制類積木（如「重複 N 次」、「如果...那麼」）擁有凹槽，可直接把其他積木拖進凹槽內，觀察大括號 { } 與縮排的對應關係！
      </div>
    </div>
  </section>
</div>

<script>
// 1. Categories Definition
const CATEGORIES = [
  { id: 'all', name: '全部', color: '#38bdf8' },
  { id: 'motion', name: '動作', color: '#4C97FF' },
  { id: 'looks', name: '外觀', color: '#9966FF' },
  { id: 'sound', name: '音效', color: '#CF63CF' },
  { id: 'events', name: '事件', color: '#FFBF00' },
  { id: 'control', name: '控制', color: '#FFAB19' },
  { id: 'sensing', name: '偵測', color: '#5CB1D6' },
  { id: 'operators', name: '運算', color: '#59C059' },
  { id: 'variables', name: '變數', color: '#FF8C1A' },
  { id: 'lists', name: '清單', color: '#FF661A' },
  { id: 'myblocks', name: '函式', color: '#FF6680' }
];

// 2. Full Block Definitions parsed from project.json (All 9 Categories)
const BLOCK_DEFS = {
  // === MOTION (動作) ===
  motion_movesteps: {
    cat: 'motion', shape: 'stack', label: '移動 {STEPS} 點',
    params: { STEPS: { type: 'num', val: '10' } },
    concept: '文字型程式語言本身沒有「角色座標」，通常會用變數 x, y 搭配三角函數（cos / sin）更新位置。',

// State
let currentCategory = 'all';
let currentLang = 'cpp';
let selectedBlockUid = null;
let workspaceTree = [];
let uidCounter = 1;

function createBlockInstance(defId, overrideParams = {}, children = [], elseChildren = [], boolSlot = null) {
  const def = BLOCK_DEFS[defId];
  const params = {};
  for (const k in def.params) {
    params[k] = overrideParams[k] !== undefined ? overrideParams[k] : def.params[k].val;
  }
  return {
    uid: 'b_' + (uidCounter++),
    defId,
    params,
    children,
    elseChildren,
    boolSlot
  };
}

// Initialize Category Sidebar
function renderCategories() {
  const sidebar = document.getElementById('categorySidebar');
  sidebar.innerHTML = CATEGORIES.map(cat => `
    <button class="cat-btn ${currentCategory === cat.id ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span>${cat.name}</span>
    </button>
  `).join('');
}

function selectCategory(catId) {
  currentCategory = catId;
  renderCategories();
  renderPalette();
}

// Render Left Palette
function renderPalette() {
  const listEl = document.getElementById('blockList');
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  listEl.innerHTML = '';

  const catNameMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c.name]));
  let lastCat = '';

  Object.entries(BLOCK_DEFS).forEach(([defId, def]) => {
    if (currentCategory !== 'all' && def.cat !== currentCategory) return;
    const labelText = def.label.replace(/\{[A-Z0-9_]+\}/g, '');
    if (keyword && !labelText.toLowerCase().includes(keyword) && !catNameMap[def.cat].includes(keyword) && !defId.toLowerCase().includes(keyword)) {
      return;
    }

    if (currentCategory === 'all' && def.cat !== lastCat) {
      lastCat = def.cat;
      const title = document.createElement('div');
      title.className = 'palette-group-title';
      title.textContent = catNameMap[def.cat];
      listEl.appendChild(title);
    }

    const blockEl = document.createElement('div');
    blockEl.className = `s-block cat-${def.cat} ${def.shape === 'hat' ? 'hat' : def.shape === 'reporter' ? 'reporter' : def.shape === 'boolean' ? 'boolean' : def.shape === 'cap' ? 'cap' : ''}`;
    blockEl.draggable = true;
    blockEl.innerHTML = formatPaletteLabel(def);

    blockEl.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'palette', defId }));
    });

    blockEl.addEventListener('click', () => {
      addBlockToWorkspace(defId);
    });

    blockEl.addEventListener('mouseenter', () => {
      showConcept(defId);
    });

    listEl.appendChild(blockEl);
  });
}

function formatPaletteLabel(def) {
  return def.label.replace(/\{([A-Z0-9_]+)\}/g, (_, key) => {
    const p = def.params[key];
    if (!p) return '';
    if (p.type === 'bool') return `<span class="b-slot-bool">條件</span>`;
    if (p.type === 'select') {
      const optLabel = p.options.find(o => o[0] === p.val)?.[1] || p.val;
      return `<span class="b-select">${optLabel} ▾</span>`;
    }
    if (p.type === 'color') {
      return `<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${p.val};border:1.5px solid #fff;"></span>`;
    }
    return `<span class="b-input">${p.val}</span>`;
  });
}

function addBlockToWorkspace(defId) {
  const newNode = createBlockInstance(defId);
  workspaceTree.push(newNode);
  selectedBlockUid = newNode.uid;
  showConcept(defId);
  renderAll();
}

// Render Center Workspace
function renderWorkspace() {
  const canvas = document.getElementById('workspaceCanvas');
  const totalBlocks = countBlocks(workspaceTree);
  document.getElementById('blockCountLabel').textContent = `${totalBlocks} 個積木`;

  if (workspaceTree.length === 0) {
    canvas.innerHTML = `
      <div class="workspace-empty">
        <h3>從左側拖曳或點擊積木開始</h3>
        <p>支援積木上下排列、控制積木凹槽包覆，以及將布林條件積木嵌入「如果 / 重複直到」的六角形插槽中。</p>
      </div>
    `;
    return;
  }

  canvas.innerHTML = '';
  workspaceTree.forEach(node => {
    canvas.appendChild(renderWorkspaceNode(node));
  });
}

function countBlocks(list) {
  let count = 0;
  for (const item of list) {
    count += 1;
    if (item.children) count += countBlocks(item.children);
    if (item.elseChildren) count += countBlocks(item.elseChildren);
    if (item.boolSlot) count += 1;
  }
  return count;
}

function renderWorkspaceNode(node) {
  const def = BLOCK_DEFS[node.defId];
  const wrapper = document.createElement('div');
  wrapper.className = `ws-item ${selectedBlockUid === node.uid ? 'selected' : ''}`;
  wrapper.dataset.uid = node.uid;

  wrapper.addEventListener('click', e => {
    e.stopPropagation();
    selectedBlockUid = node.uid;
    showConcept(node.defId);
    renderWorkspace();
    highlightCodeForUid(node.uid);
  });

  wrapper.addEventListener('mouseenter', e => {
    e.stopPropagation();
    highlightCodeForUid(node.uid);
  });

  if (def.shape === 'c-block' || def.shape === 'c-block-else') {
    const cWrap = document.createElement('div');
    cWrap.className = 'c-block-wrapper';

    // Top Header
    const topRow = document.createElement('div');
    topRow.className = 'ws-block-row';
    const topBlock = createEditableBlockEl(node, 'c-block-top');
    topRow.appendChild(topBlock);
    topRow.appendChild(createDeleteBtn(node.uid));
    cWrap.appendChild(topRow);

    // Body 1
    cWrap.appendChild(createCMouth(node, 'children'));

    // Else Middle & Body 2
    if (def.shape === 'c-block-else') {
      const mid = document.createElement('div');
      mid.className = 'c-block-mid';
      mid.textContent = def.elseLabel || '否則';
      cWrap.appendChild(mid);
      cWrap.appendChild(createCMouth(node, 'elseChildren'));
    }

    // Bottom Cap
    const bot = document.createElement('div');
    bot.className = 'c-block-bottom';
    cWrap.appendChild(bot);

    wrapper.appendChild(cWrap);
  } else {
    const row = document.createElement('div');
    row.className = 'ws-block-row';
    row.appendChild(createEditableBlockEl(node, ''));
    row.appendChild(createDeleteBtn(node.uid));
    wrapper.appendChild(row);
  }

  return wrapper;
}

function createCMouth(node, branchKey) {
  const body = document.createElement('div');
  body.className = 'c-block-body';

  const spine = document.createElement('div');
  spine.className = 'c-block-spine';

  const inner = document.createElement('div');
  inner.className = 'c-block-inner';

  inner.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    inner.classList.add('drag-over');
  });
  inner.addEventListener('dragleave', e => {
    e.stopPropagation();
    inner.classList.remove('drag-over');
  });
  inner.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    inner.classList.remove('drag-over');
    handleDropIntoList(e, node[branchKey]);
  });

  if (node[branchKey].length === 0) {
    const ph = document.createElement('div');
    ph.className = 'drop-placeholder';
    ph.textContent = '拖曳積木至此凹槽內...';
    inner.appendChild(ph);
  } else {
    node[branchKey].forEach(child => {
      inner.appendChild(renderWorkspaceNode(child));
    });
  }

  body.appendChild(spine);
  body.appendChild(inner);
  return body;
}

function createEditableBlockEl(node, extraClass) {
  const def = BLOCK_DEFS[node.defId];
  const el = document.createElement('div');
  const shapeCls = def.shape === 'hat' ? 'hat' : def.shape === 'reporter' ? 'reporter' : def.shape === 'boolean' ? 'boolean' : def.shape === 'cap' ? 'cap' : '';
  el.className = `s-block cat-${def.cat} ${shapeCls} ${extraClass}`;
  el.draggable = true;

  el.addEventListener('dragstart', e => {
    e.stopPropagation();
    e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'workspace', uid: node.uid }));
  });

  // Build interactive parts
  const parts = def.label.split(/(\{[A-Z0-9_]+\})/g);
  parts.forEach(part => {
    const match = part.match(/^\{([A-Z0-9_]+)\}$/);
    if (!match) {
      if (part) {
        const span = document.createElement('span');
        span.textContent = part;
        el.appendChild(span);
      }
      return;
    }

    const key = match[1];
    const pDef = def.params[key];
    if (!pDef) return;

    if (pDef.type === 'bool') {
      const slot = document.createElement('div');
      slot.className = 'b-slot-bool';
      slot.addEventListener('dragover', e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.add('drag-over');
      });
      slot.addEventListener('dragleave', e => {
        e.stopPropagation();
        slot.classList.remove('drag-over');
      });
      slot.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.remove('drag-over');
        try {
          const data = JSON.parse(e.dataTransfer.getData('text/plain'));
          if (data.source === 'palette') {
            node.boolSlot = createBlockInstance(data.defId);
            renderAll();
          }
        } catch (err) {}
      });

      if (node.boolSlot) {
        const subDef = BLOCK_DEFS[node.boolSlot.defId];
        slot.style.background = 'transparent';
        slot.style.border = 'none';
        slot.style.padding = '0';
        const mini = createEditableBlockEl(node.boolSlot, '');
        mini.style.padding = '3px 12px';
        mini.style.fontSize = '11.5px';
        mini.title = '雙擊移除條件積木';
        mini.addEventListener('dblclick', e => {
          e.stopPropagation();
          node.boolSlot = null;
          renderAll();
        });
        slot.appendChild(mini);
      } else {
        slot.textContent = '拖入條件';
      }
      el.appendChild(slot);
    } else if (pDef.type === 'select') {
      const sel = document.createElement('select');
      sel.className = 'b-select';
      pDef.options.forEach(([val, text]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = text;
        if (node.params[key] === val) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('change', e => {
        node.params[key] = e.target.value;
        renderCode();
      });
      el.appendChild(sel);
    } else if (pDef.type === 'color') {
      const inp = document.createElement('input');
      inp.type = 'color';
      inp.value = node.params[key];
      inp.style.width = '24px';
      inp.style.height = '20px';
      inp.style.border = 'none';
      inp.style.borderRadius = '4px';
      inp.style.cursor = 'pointer';
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('input', e => {
        node.params[key] = e.target.value;
        renderCode();
      });
      el.appendChild(inp);
    } else {
      const inp = document.createElement('input');
      inp.className = 'b-input';
      inp.type = 'text';
      inp.value = node.params[key];
      inp.style.width = Math.max(34, (String(node.params[key]).length + 2) * 8) + 'px';
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('input', e => {
        node.params[key] = e.target.value;
        inp.style.width = Math.max(34, (e.target.value.length + 2) * 8) + 'px';
        renderCode();
      });
      el.appendChild(inp);
    }
  });

  return el;
}

function createDeleteBtn(uid) {
  const btn = document.createElement('button');
  btn.className = 'del-btn';
  btn.innerHTML = '✕';
  btn.title = '刪除此積木';
  btn.addEventListener('click', e => {
    e.stopPropagation();
    removeNodeByUid(workspaceTree, uid);
    if (selectedBlockUid === uid) selectedBlockUid = null;
    renderAll();
  });
  return btn;
}

function removeNodeByUid(list, uid) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].uid === uid) {
      return list.splice(i, 1)[0];
    }
    if (list[i].children) {
      const found = removeNodeByUid(list[i].children, uid);
      if (found) return found;
    }
    if (list[i].elseChildren) {
      const found = removeNodeByUid(list[i].elseChildren, uid);
      if (found) return found;
    }
  }
  return null;
}

// Drag & Drop Handlers
function handleCanvasDragOver(e) {
  e.preventDefault();
  document.getElementById('workspaceCanvas').classList.add('drag-over');
}

function handleCanvasDragLeave(e) {
  document.getElementById('workspaceCanvas').classList.remove('drag-over');
}

function handleCanvasDrop(e) {
  e.preventDefault();
  document.getElementById('workspaceCanvas').classList.remove('drag-over');
  handleDropIntoList(e, workspaceTree);
}

function handleDropIntoList(e, targetList) {
  try {
    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (data.source === 'palette') {
      const newNode = createBlockInstance(data.defId);
      targetList.push(newNode);
      selectedBlockUid = newNode.uid;
      showConcept(data.defId);
      renderAll();
    } else if (data.source === 'workspace') {
      const moved = removeNodeByUid(workspaceTree, data.uid);
      if (moved) {
        targetList.push(moved);
        renderAll();
      }
    }
  } catch (err) {}
}

// Code Generation Engine
function setLanguage(lang) {
  currentLang = lang;
  ['cpp', 'cs', 'py'].forEach(l => {
    document.getElementById('btn-' + l).classList.toggle('active', l === lang);
  });
  renderCode();
}

function generateLines() {
  const lines = [];
  const lang = currentLang;

  if (workspaceTree.length === 0) {
    if (lang === 'cpp') {
      lines.push({ text: '// 請從左側拖曳或點擊積木，即時產生 C++ 程式碼', uid: null });
      lines.push({ text: '#include <iostream>', uid: null });
      lines.push({ text: 'int main() {', uid: null });
      lines.push({ text: '    return 0;', uid: null });
      lines.push({ text: '}', uid: null });
    } else if (lang === 'cs') {
      lines.push({ text: '// 請從左側拖曳或點擊積木，即時產生 C# 程式碼', uid: null });
      lines.push({ text: 'using System;', uid: null });
      lines.push({ text: 'class Program {', uid: null });
      lines.push({ text: '    static void Main() { }', uid: null });
      lines.push({ text: '}', uid: null });
    } else {
      lines.push({ text: '# 請從左側拖曳或點擊積木，即時產生 Python 程式碼', uid: null });
      lines.push({ text: 'print("Ready!")', uid: null });
    }
    return lines;
  }

  let hasOpenHat = false;

  function emitList(nodes, indentLevel) {
    const pad = '    '.repeat(indentLevel);
    nodes.forEach(node => {
      const def = BLOCK_DEFS[node.defId];
      let condCode = null;
      if (node.boolSlot) {
        const subDef = BLOCK_DEFS[node.boolSlot.defId];
        condCode = subDef.code[lang](node.boolSlot.params);
      }

      if (def.shape === 'hat') {
        if (hasOpenHat && (lang === 'cpp' || lang === 'cs')) {
          lines.push({ text: '}', uid: null });
          lines.push({ text: '', uid: null });
        }
        hasOpenHat = true;
        lines.push({ text: def.code[lang](node.params), uid: node.uid });
      } else if (def.shape === 'c-block') {
        const [head, tail] = def.code[lang](node.params, condCode);
        lines.push({ text: pad + head, uid: node.uid });
        if (node.children.length === 0) {
          lines.push({ text: pad + '    ' + (lang === 'py' ? 'pass' : '// 空區塊'), uid: node.uid });
        } else {
          emitList(node.children, indentLevel + 1);
        }
        if (tail) lines.push({ text: pad + tail, uid: node.uid });
      } else if (def.shape === 'c-block-else') {
        const [head, mid, tail] = def.code[lang](node.params, condCode);
        lines.push({ text: pad + head, uid: node.uid });
        if (node.children.length === 0) {
          lines.push({ text: pad + '    ' + (lang === 'py' ? 'pass' : '// 條件成立區塊'), uid: node.uid });
        } else {
          emitList(node.children, indentLevel + 1);
        }
        lines.push({ text: pad + mid, uid: node.uid });
        if (node.elseChildren.length === 0) {
          lines.push({ text: pad + '    ' + (lang === 'py' ? 'pass' : '// 否則區塊'), uid: node.uid });
        } else {
          emitList(node.elseChildren, indentLevel + 1);
        }
        if (tail) lines.push({ text: pad + tail, uid: node.uid });
      } else if (def.shape === 'reporter' || def.shape === 'boolean') {
        const expr = def.code[lang](node.params);
        const stmt = lang === 'cpp'
          ? `std::cout << (${expr}) << std::endl; // 回報值演示`
          : lang === 'cs'
          ? `Console.WriteLine(${expr}); // 回報值演示`
          : `print(${expr}) # 回報值演示`;
        lines.push({ text: pad + stmt, uid: node.uid });
      } else {
        lines.push({ text: pad + def.code[lang](node.params), uid: node.uid });
      }
    });
  }

  const baseIndent = BLOCK_DEFS[workspaceTree[0].defId].shape === 'hat' ? 1 : 0;
  emitList(workspaceTree, baseIndent);

  if (hasOpenHat && (lang === 'cpp' || lang === 'cs')) {
    if (BLOCK_DEFS[workspaceTree[0].defId].code[lang]({}).includes('main()')) {
      lines.push({ text: '    return 0;', uid: null });
    }
    lines.push({ text: '}', uid: null });
  }

  return lines;
}

function syntaxHighlight(code) {
  let esc = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Comments
  esc = esc.replace(/(\/\/.*$|#.*$)/g, '<span class="tok-com">$1</span>');
  // Strings
  esc = esc.replace(/(".*?")/g, '<span class="tok-str">$1</span>');
  // Keywords
  esc = esc.replace(/\b(if|else|while|for|return|void|int|float|double|bool|string|true|false|True|False|def|in|and|or|not|pass|await|async|new|public|static|class|using|namespace)\b/g, '<span class="tok-kw">$1</span>');
  // Types / Std
  esc = esc.replace(/\b(std|cout|endl|Math|Console|Thread|DateTime|Environment|Random|List|vector)\b/g, '<span class="tok-type">$1</span>');
  return esc;
}

function renderCode() {
  const viewer = document.getElementById('codeViewer');
  const lines = generateLines();
  viewer.innerHTML = lines.map((line, idx) => `
    <div class="code-line ${selectedBlockUid && line.uid === selectedBlockUid ? 'highlight' : ''}" data-uid="${line.uid || ''}">
      <span class="line-num">${idx + 1}</span>
      <span class="line-code">${syntaxHighlight(line.text)}</span>
    </div>
  `).join('');
}

function highlightCodeForUid(uid) {
  document.querySelectorAll('.code-line').forEach(el => {
    el.classList.toggle('highlight', uid && el.dataset.uid === uid);
  });
}

function copyCode() {
  const lines = generateLines().map(l => l.text).join('\n');
  navigator.clipboard.writeText(lines);
  const btn = document.getElementById('copyBtn');
  btn.textContent = '已複製！';
  setTimeout(() => { btn.textContent = '複製程式碼'; }, 1500);
}

// Concept Explanation Card
function showConcept(defId) {
  const def = BLOCK_DEFS[defId];
  if (!def) return;
  const catName = CATEGORIES.find(c => c.id === def.cat)?.name || '';
  document.getElementById('conceptTitle').textContent = '💡 ' + def.label.replace(/\{[A-Z0-9_]+\}/g, '[參數]');
  document.getElementById('conceptCategory').textContent = catName + '積木';
  document.getElementById('conceptBody').textContent = def.concept;
  document.getElementById('conceptTip').textContent = '教學重點：' + def.tip;
}

// Presets for Classroom Demo
function loadPreset(name) {
  workspaceTree = [];
  if (name === 'ifElse') {
    const cond = createBlockInstance('operator_gt', { OPERAND1: 'score', OPERAND2: '60' });
    const ifNode = createBlockInstance('control_if_else', {}, [
      createBlockInstance('looks_say', { MESSAGE: '恭喜及格！' })
    ], [
      createBlockInstance('looks_say', { MESSAGE: '再接再厲！' })
    ], cond);
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      createBlockInstance('data_setvariableto', { VAR: 'score', VALUE: '75' }),
      ifNode
    ];
  } else if (name === 'loopSum') {
    const loopNode = createBlockInstance('control_repeat', { TIMES: '10' }, [
      createBlockInstance('data_changevariableby', { VAR: 'total', VALUE: '1' }),
      createBlockInstance('motion_movesteps', { STEPS: '10' })
    ]);
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      createBlockInstance('data_setvariableto', { VAR: 'total', VALUE: '0' }),
      loopNode,
      createBlockInstance('data_showvariable', { VAR: 'total' })
    ];
  } else if (name === 'listDemo') {
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      createBlockInstance('data_deletealloflist', { LIST: 'items' }),
      createBlockInstance('data_addtolist', { ITEM: '寶劍', LIST: 'items' }),
      createBlockInstance('data_addtolist', { ITEM: '藥水', LIST: 'items' }),
      createBlockInstance('data_replaceitemoflist', { LIST: 'items', INDEX: '1', ITEM: '傳說神劍' }),
      createBlockInstance('data_showlist', { LIST: 'items' })
    ];
  } else if (name === 'cloneDemo') {
    const loop = createBlockInstance('control_repeat', { TIMES: '5' }, [
      createBlockInstance('control_create_clone_of', { CLONE_OPTION: '_myself_' }),
      createBlockInstance('control_wait', { DURATION: '0.5' })
    ]);
    workspaceTree = [
      createBlockInstance('event_whenflagclicked'),
      loop,
      createBlockInstance('control_start_as_clone'),
      createBlockInstance('motion_goto', { TO: '_random_' }),
      createBlockInstance('looks_show')
    ];
  }
  selectedBlockUid = workspaceTree[0]?.uid || null;
  if (workspaceTree[0]) showConcept(workspaceTree[0].defId);
  renderAll();
}

function clearWorkspace() {
  workspaceTree = [];
  selectedBlockUid = null;
  renderAll();
}

function renderAll() {
  renderWorkspace();
  renderCode();
}

// Init
renderCategories();
renderPalette();
loadPreset('ifElse');
